{% extends 'base.html' %}
{% block title %}Editar Perfil | Clone X{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-8">
        <div class="card shadow-sm">
            <div class="card-body">
                <h4 class="mb-4 text-center fw-bold">Editar Perfil</h4>
                
                <form method="POST" enctype="multipart/form-data">
                    {% csrf_token %}
                    
                    <div class="row">
                        <div class="col-md-4 text-center mb-4">
                            {% if user.profile_picture %}
                                <img src="{{ user.profile_picture.url }}" alt="Foto atual" 
                                    class="rounded-circle img-fluid mb-3" style="width: 150px; height: 150px; object-fit: cover;">
                            {% else %}
                                <div class="rounded-circle bg-secondary d-flex align-items-center justify-content-center mb-3 mx-auto" 
                                    style="width: 150px; height: 150px;">
                                    <span class="text-white fw-bold fs-1">{{ user.username|first|upper }}</span>
                                </div>
                            {% endif %}
                            
                            <div class="mb-3">
                                <label for="profile_picture" class="form-label">Alterar foto</label>
                                <input type="file" class="form-control" id="profile_picture" name="profile_picture" accept="image/*">
                            </div>
                        </div>
                        
                        <div class="col-md-8">
                            <div class="row">
                                <div class="col-md-6 mb-3">
                                    <label for="first_name" class="form-label">Nome</label>
                                    <input type="text" class="form-control" id="first_name" name="first_name" 
                                        value="{{ user.first_name }}">
                                </div>
                                <div class="col-md-6 mb-3">
                                    <label for="last_name" class="form-label">Sobrenome</label>
                                    <input type="text" class="form-control" id="last_name" name="last_name" 
                                        value="{{ user.last_name }}">
                                </div>
                            </div>
                            
                            <div class="mb-3">
                                <label for="username" class="form-label">Usuário</label>
                                <input type="text" class="form-control" id="username" value="{{ user.username }}" disabled>
                                <small class="text-muted">O nome de usuário não pode ser alterado.</small>
                            </div>
                            
                            <div class="mb-3">
                                <label for="email" class="form-label">E-mail</label>
                                <input type="email" class="form-control" id="email" value="{{ user.email }}" disabled>
                            </div>
                            
                            <div class="mb-3">
                                <label for="bio" class="form-label">Biografia</label>
                                <textarea class="form-control" id="bio" name="bio" rows="3" 
                                        placeholder="Conte um pouco sobre você...">{{ user.bio }}</textarea>
                            </div>
                            
                            <div class="mb-3">
                                <label for="location" class="form-label">Localização</label>
                                <input type="text" class="form-control" id="location" name="location" 
                                    value="{{ user.location }}" placeholder="Cidade, Estado">
                            </div>
                            
                            <div class="mb-3">
                                <label for="website" class="form-label">Website</label>
                                <input type="url" class="form-control" id="website" name="website" 
                                    value="{{ user.website }}" placeholder="https://exemplo.com">
                            </div>
                        </div>
                    </div>
                    
                    <div class="d-grid gap-2 d-md-flex justify-content-md-end">
                        <a href="{% url 'profile' %}" class="btn btn-outline-secondary me-md-2">Cancelar</a>
                        <button type="submit" class="btn btn-dark">Salvar Alterações</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
